# RoboVLA System Configuration
system:
  name: "RoboVLA"
  version: "1.0.0"
  device: "cuda:0"
  mixed_precision: true
  compile_models: true

# Hardware Configuration
hardware:
  gpu:
    model: "RTX_3060"
    vram_gb: 12
    reserved_gb: 2.0
    max_batch_size: 4
  cpu:
    num_workers: 4
    prefetch_factor: 2

# Perception Configuration
perception:
  dino:
    model_name: "facebook/dinov2-base"
    variant: "vit_base_patch14"
    feature_dim: 768
    num_classes: null  # Zero-shot
    image_size: 518
    batch_size: 1
    quantization: "int8"

  midas:
    model_type: "DPT_Hybrid"
    optimize: true
    fp16: true
    max_depth: 10.0
    min_depth: 0.1

  point_cloud:
    voxel_size: 0.01
    max_points: 50000
    camera_intrinsics:
      fx: 525.0
      fy: 525.0
      cx: 320.0
      cy: 240.0

  gaussian_splatting:
    num_gaussians: 10000
    optimization_iterations: 30
    learning_rate: 0.01
    position_lr_scale: 1.0
    feature_lr: 0.0025
    opacity_lr: 0.05
    scaling_lr: 0.005
    rotation_lr: 0.001

# Language Understanding
language:
  llama:
    model_name: "meta-llama/Llama-3.1-8B"
    quantization:
      load_in_4bit: true
      bnb_4bit_compute_dtype: "float16"
      bnb_4bit_quant_type: "nf4"
      bnb_4bit_use_double_quant: true
    lora:
      r: 16
      lora_alpha: 32
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      lora_dropout: 0.1
      bias: "none"
      task_type: "CAUSAL_LM"
    generation:
      max_length: 512
      temperature: 0.7
      top_p: 0.9
      do_sample: true

  clip:
    model_name: "openai/clip-vit-base-patch32"
    image_size: 224
    embed_dim: 512
    quantization: "int8"

# Knowledge Graph
knowledge:
  neo4j:
    uri: "bolt://localhost:7687"
    database: "robot_knowledge"
    username: "neo4j"
    password: "password"
    max_connection_pool_size: 50

  chromadb:
    persist_directory: "./data/cache/chromadb"
    collection_name: "robot_knowledge"
    embedding_model: "all-MiniLM-L6-v2"
    embedding_dim: 384
    distance_metric: "cosine"

  vlad:
    vocab_size: 64
    descriptor_dim: 512
    normalize: true

# VLA Model
vla_model:
  architecture:
    visual_encoder_dim: 768
    text_encoder_dim: 4096
    hidden_dim: 256
    num_attention_heads: 8
    num_decoder_layers: 4
    feedforward_dim: 1024
    dropout: 0.1

  action:
    num_joints: 7
    gripper_dim: 1
    action_dim: 8
    trajectory_steps: 10
    control_frequency: 10  # Hz

  training:
    batch_size: 4
    gradient_accumulation_steps: 8
    learning_rate: 1.0e-4
    weight_decay: 0.01
    warmup_steps: 1000
    max_steps: 100000
    eval_steps: 1000
    save_steps: 5000

  optimization:
    optimizer: "adamw_8bit"
    scheduler: "cosine"
    num_cycles: 0.5
    gradient_checkpointing: true
    mixed_precision: "fp16"

# Reinforcement Learning
rl:
  algorithm: "SAC"
  state_dim: 786
  action_dim: 8
  hidden_dim: 256
  buffer_size: 100000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  alpha: 0.2
  learning_rate: 3.0e-4
  update_frequency: 100
  target_update_interval: 1

  reward:
    grasp_success: 10.0
    distance_weight: -0.1
    time_penalty: -0.01
    smoothness_weight: -0.1
    collision_penalty: -5.0

# Production Server
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  log_level: "info"
  max_concurrent_requests: 100
  timeout: 30

  cors:
    allow_origins: ["*"]
    allow_credentials: true
    allow_methods: ["*"]
    allow_headers: ["*"]

# Monitoring
monitoring:
  prometheus:
    port: 9090
    scrape_interval: 15

  grafana:
    port: 3000
    admin_password: "admin"

  wandb:
    project: "robo-vla"
    entity: "your-team"
    log_frequency: 100

  logging:
    level: "INFO"
    format: "json"
    file: "./logs/robo_vla.log"
    rotation: "100 MB"

# Data Pipeline
data:
  image_size: [640, 480]
  depth_size: [640, 480]
  augmentation:
    color_jitter: 0.2
    random_crop: true
    gaussian_noise: 0.01
    rotation_degrees: 15

  cache:
    enabled: true
    max_size_gb: 50
    ttl_hours: 24

# Deployment
deployment:
  kubernetes:
    namespace: "robo-vla"
    min_replicas: 2
    max_replicas: 10
    target_cpu_utilization: 70
    target_memory_utilization: 80

  docker:
    base_image: "nvidia/cuda:12.1.0-cudnn8-runtime-ubuntu22.04"
    python_version: "3.10"

  model_serving:
    tensorrt: true
    onnx_export: true
    triton_inference_server: false
